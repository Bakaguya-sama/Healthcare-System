name: Backend CI

on:
  push:
    branches: [main, develop, huy/refactor]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "24.9.0"
  PNPM_VERSION: "9.0.0"

jobs:
  quality:
    name: Lint, typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Check backend repository boundary
        run: pnpm --filter api boundary:check

      - name: Build API
        run: pnpm --filter api build

      - name: Run unit and characterization tests
        run: pnpm --filter api test:unit

      - name: Check generated realtime contract
        run: pnpm --filter api realtime:check

  integration:
    name: Integration and HTTP contract tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MongoDB replica set and Redis
        run: docker compose up -d --wait --wait-timeout 180 mongo redis

      - name: Run infrastructure integration tests
        run: pnpm --filter api test:integration

      - name: Run HTTP contract tests
        run: pnpm --filter api test:e2e

      - name: Check generated OpenAPI contract
        run: pnpm --filter api openapi:check
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/healthcare_openapi_ci?replicaSet=rs0&directConnection=true
          REDIS_URL: redis://localhost:16379
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          CORS_ORIGINS: http://localhost:5173
          SWAGGER_ENABLED: "true"
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder
          SMTP_HOST: localhost
          SMTP_PORT: "1025"
          SMTP_SECURE: "false"
          SMTP_USER: ci-placeholder
          SMTP_PASS: ci-placeholder
          SMTP_FROM: ci@example.com

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color mongo redis

      - name: Stop test infrastructure
        if: always()
        run: docker compose down
