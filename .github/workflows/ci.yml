name: Backend CI

on:
  push:
    branches: [main, develop, huy/refactor]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "24.9.0"
  PNPM_VERSION: "9.0.0"

jobs:
  quality:
    name: Lint, typecheck, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Typecheck API
        run: pnpm --filter api typecheck

      - name: Build API
        run: pnpm --filter api build

      - name: Run unit and characterization tests
        run: pnpm --filter api test:unit

  integration:
    name: Integration and HTTP contract tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Start MongoDB replica set and Redis
        run: docker compose up -d --wait --wait-timeout 180 mongo redis

      - name: Run infrastructure integration tests
        run: pnpm --filter api test:integration

      - name: Run HTTP contract tests
        run: pnpm --filter api test:e2e

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color mongo redis

      - name: Stop test infrastructure
        if: always()
        run: docker compose down
